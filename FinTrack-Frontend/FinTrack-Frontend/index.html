<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack</title>
  </head>
  <body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#f2f2f2;">
    
    <!--login demo-->
    <div>

    <div style="
        width:300px;
        margin:100px auto;
        padding:20px;
        background-color:#ffffff;
        border-radius:5px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    ">
        <h2 style="text-align:center; margin-bottom:20px;">Login</h2>

        <form>
            <label>Username</label><br>
            <input type="text" placeholder="Enter username" style="
                width:100%;
                padding:8px;
                margin:8px 0;
                border:1px solid #ccc;
                border-radius:4px;
            ">

            <label>Password</label><br>
            <input type="password" placeholder="Enter password" style="
                width:100%;
                padding:8px;
                margin:8px 0;
                border:1px solid #ccc;
                border-radius:4px;
            ">

            <input type="submit" value="Login" style="
                width:100%;
                padding:10px;
                background-color:#2de00d;
                color:white;
                border:none;
                border-radius:4px;
                cursor:pointer;
                margin-top:10px;
            ">
        </form>
    </div>

    </div>
    
  </body>
</html>
